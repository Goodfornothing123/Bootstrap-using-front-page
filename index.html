<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

<!-- Bootstrap 3 JS -->
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

<!-- Bootstrap Validator JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.bootstrapvalidator/0.5.3/js/bootstrapValidator.min.js"></script>

          <ul class="nav navbar-nav ">
           <li class="active">

    <div class="container">
        <h1 class="text-success text-center">Contact Us</h1><b></b>
            <div class="col-lg-8 m-auto">
               <form id="myform"  action="#" class="bg-light" method="post">
                   <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" value="" name="name" placeholder="Full Name">
                    <span id="username" class="text-danger font-weight-bold"></span>
                   </div>
               

                   <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" value="" name="email" placeholder="example@domain.com">
                    <span id="emailid" class="text-danger font-weight-bold"></span>
                   </div>

                     <div class="form-group">
                    <label for="Contact">Contact NO.:</label>
                    <input type="number" maxlength="10"  class="form-control" value="" name="phone" placeholder="Contact No.">
                    <span id="phone no" class="text-danger font-weight-bold"></span>
                   </div>

                     <div class="form-group">
                    <label>Comments</label>
                    <textarea class="form-control" name="comment" row="5" style="resize: none;"></textarea>
                    <span id="comentbox" class="text-danger font-weight-bold"></span>
                   </div>
                   
                   <button type="submit" value="Submit" class="btn btn-success btn-lg">Submit</button>
               </form>
            </div>
    </div>

    <script type="text/javascript">
        $(document).ready(function(){
        $('#myform').bootstrapValidator({
         feedbackIcons:{
            valid:'glyphicon glyphicon-ok',
            invalid:'glyphicon glyphicon-remove',
            validating:'glyphicon glyphicon-refresh'
         },
         fields:{
            name:{
                validators:{
                    stringLength:{
                        min:2,
                        message:'Please enter at least 2 characters'
                    },
                    notEmpty:{
                        message:'Please enter Your Name'
                    }
                }
            },
            email:{
                validators:{
                    notEmpty:{
                         message:'Please enter Your Email Id'
                    },
                    emailAddress:{
                        message:'please Enter Valid Email id'
                    }
                }
            },
           phone: {
    validators: {
        notEmpty: {
            message: 'Please enter your phone number'
        },
        regexp: {
            regexp: /^[0-9]{10}$/,
            message: 'Please enter a valid 10-digit phone number'
        }
    }
},
              comment:{
                validators:{
                    stringlength:{
                        min:10,
                        max:200,
                        message:'please Enter at Least chars and not more than 200'
                    },
                    notEmpty:{
                        message:'please enter comment'
                    }
                }
              }
         }
        });

    });
    </script>
</body>
